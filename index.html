<!DOCTYPE html>
<html lang="ja" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漫画読録</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="min-h-full flex flex-col bg-slate-950 text-slate-100 selection:bg-brand-500 selection:text-white">

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800/80 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <!-- App Title & Cloud Sync Status Badge -->
            <div class="flex items-center gap-2 sm:gap-3 select-none shrink-0">
                <span class="font-black text-xl sm:text-2xl tracking-tight text-white">漫画読録</span>
                <span id="syncStatusBadge" class="hidden text-[11px] font-semibold px-2.5 py-1 rounded-full transition duration-300">
                </span>
            </div>

            <!-- Action buttons -->
            <div class="flex items-center gap-2 sm:gap-3 shrink-0">
                <!-- Google Login / Logout -->
                <div id="googleAuthContainer" class="flex items-center shrink-0">
                    <button onclick="handleGoogleLogin()" id="googleLoginBtn" class="px-3.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs text-slate-200 font-semibold transition flex items-center gap-1.5 border border-slate-700/60 shadow-sm whitespace-nowrap" title="ログイン">
                        <i class="fa-solid fa-arrow-right-to-bracket text-[11px] sm:hidden"></i>
                        <span class="hidden sm:inline">ログイン</span>
                    </button>
                    <button onclick="handleGoogleLogout()" id="googleLogoutBtn" class="hidden px-3.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 hover:text-rose-400 text-xs text-slate-300 font-semibold transition border border-slate-700/60 shadow-sm flex items-center gap-1.5 whitespace-nowrap" title="ログアウト">
                        <i class="fa-solid fa-right-from-bracket text-[11px]"></i>
                        <span class="hidden sm:inline">ログアウト</span>
                    </button>
                </div>

                <!-- AI Recommendation Modal Trigger Button -->
                <button onclick="openAiRecommendModal()" class="px-3 py-2 rounded-xl bg-gradient-to-r from-purple-600 via-indigo-600 to-brand-600 hover:from-purple-500 hover:to-brand-500 text-white text-xs sm:text-sm font-semibold transition flex items-center gap-1.5 shadow-lg shadow-indigo-600/30 hover:scale-[1.02] active:scale-[0.98] shrink-0" title="AI診断">
                    <i class="fa-solid fa-wand-magic-sparkles text-amber-300"></i>
                    <span class="hidden sm:inline">AI診断</span>
                </button>

                <button onclick="openAddModal()" class="px-3.5 py-2 rounded-xl bg-brand-600 hover:bg-brand-500 text-white text-xs sm:text-sm font-semibold transition flex items-center gap-1.5 shadow-lg shadow-brand-600/30 hover:scale-[1.02] active:scale-[0.98] shrink-0" title="作品追加">
                    <i class="fa-solid fa-plus"></i>
                    <span class="hidden sm:inline">作品追加</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Notification Toast Container -->
    <div id="toastContainer" class="fixed top-20 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <!-- Filter & Control Bar -->
        <div class="bg-slate-900/90 border border-slate-800/80 rounded-2xl p-4 space-y-4 shadow-sm">
            <!-- Status Tabs -->
            <div class="flex items-center gap-1.5 overflow-x-auto pb-1 border-b border-slate-800/60 scrollbar-none">
                <button onclick="setFilterStatus('all')" id="tab-all" class="status-tab active px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition whitespace-nowrap bg-brand-600 text-white">
                    すべて
                </button>
                <button onclick="setFilterStatus('reading')" id="tab-reading" class="status-tab px-4 py-2 rounded-xl text-xs sm:text-sm font-medium transition whitespace-nowrap text-slate-400 hover:text-slate-200 hover:bg-slate-800">
                    📖 読書中
                </button>
                <button onclick="setFilterStatus('completed')" id="tab-completed" class="status-tab px-4 py-2 rounded-xl text-xs sm:text-sm font-medium transition whitespace-nowrap text-slate-400 hover:text-slate-200 hover:bg-slate-800">
                    ✅ 読了
                </button>
                <button onclick="setFilterStatus('plan')" id="tab-plan" class="status-tab px-4 py-2 rounded-xl text-xs sm:text-sm font-medium transition whitespace-nowrap text-slate-400 hover:text-slate-200 hover:bg-slate-800">
                    🔖 読みたい
                </button>
                <button onclick="setFilterStatus('dropped')" id="tab-dropped" class="status-tab px-4 py-2 rounded-xl text-xs sm:text-sm font-medium transition whitespace-nowrap text-slate-400 hover:text-slate-200 hover:bg-slate-800">
                    ⏸ 中断
                </button>
            </div>

            <!-- Search & Sort options -->
            <div class="flex flex-col sm:flex-row gap-3 items-center w-full">
                <!-- Search input -->
                <div class="relative w-full sm:flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                    <input type="text" id="searchInput" oninput="renderApp()" placeholder="タイトル・作者名で検索..." 
                           class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition">
                </div>

                <!-- Sort Filter & View Mode Toggle -->
                <div class="flex items-center gap-2 w-full sm:w-auto">
                    <select id="sortSelect" onchange="renderApp()" class="flex-1 sm:w-48 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-300 focus:outline-none focus:border-brand-500 transition">
                        <option value="updated-desc">更新日時が新しい順</option>
                        <option value="rating-desc">評価が高い順</option>
                        <option value="chapter-desc">読了話数が多い順</option>
                        <option value="title-asc">タイトル名順 (五十音)</option>
                    </select>
                    <button onclick="toggleViewMode()" class="px-3.5 py-2 rounded-xl bg-slate-950 border border-slate-800 text-slate-400 hover:text-slate-200 hover:border-slate-700 transition flex items-center justify-center shrink-0" title="表示切り替え">
                        <i id="viewModeIcon" class="fa-solid fa-list text-sm"></i>
                    </button>
                </div>

        </div>

        <!-- Manga Covers Grid Container -->
        <div id="mangaGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 sm:gap-5"></div>

        <!-- Empty State View -->
        <div id="emptyState" class="hidden py-16 text-center space-y-4">
            <div class="w-20 h-20 mx-auto rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-600 text-3xl">
                <i class="fa-solid fa-book"></i>
            </div>
            <div>
                <h3 class="text-lg font-bold text-slate-300">作品がありません</h3>
                <p class="text-sm text-slate-500 mt-1">新しい漫画を追加するか、ログインして同期してください。</p>
            </div>
            <button onclick="openAddModal()" class="px-4 py-2 bg-brand-600 hover:bg-brand-500 text-white text-sm font-semibold rounded-xl transition shadow-lg shadow-brand-600/20 inline-flex items-center gap-2">
                <i class="fa-solid fa-plus"></i> 新しい作品を追加する

    </main>

    <!-- Modal: Add / Edit Manga -->

        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl transform scale-95 transition-transform duration-200" id="mangaModalContent">
            <div class="px-6 py-4 border-b border-slate-800 flex items-center justify-between">
                <h3 id="modalTitle" class="text-base font-bold text-white">新しい漫画を登録</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white p-1 rounded-lg transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <form id="mangaForm" onsubmit="handleFormSubmit(event)" class="p-6 space-y-4 max-h-[80vh] overflow-y-auto">
                <input type="hidden" id="mangaId">

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">作品タイトル <span class="text-rose-400">*</span></label>
                        <input type="text" id="formTitle" required placeholder="例: 怪獣8号" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-brand-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">作者名</label>
                        <input type="text" id="formAuthor" placeholder="例: 松本直也" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-brand-500">
                    </div>
                </div>

                <div class="bg-slate-950/70 p-3.5 rounded-xl border border-slate-800 space-y-3">
                    <span class="text-xs font-bold text-brand-400 flex items-center gap-1.5">
                        <i class="fa-solid fa-list-ol"></i> 読書進捗（何話まで読んだか）
                    </span>
                    <div>
                        <label class="block text-[11px] font-medium text-slate-400 mb-1">現在の到達話（既読）</label>
                        <input type="number" id="formReadChap" min="0" value="0" required class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-brand-500">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">ステータス</label>
                        <select id="formStatus" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-brand-500">
                            <option value="reading">📖 読書中</option>
                            <option value="completed">✅ 読了</option>
                            <option value="plan">🔖 読みたい</option>
                            <option value="dropped">⏸ 中断</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">作品評価 (星)</label>
                        <select id="formRating" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-brand-500">
                            <option value="5">★★★★★ (5.0)</option>
                            <option value="4">★★★★☆ (4.0)</option>
                            <option value="3">★★★☆☆ (3.0)</option>
                            <option value="2">★★☆☆☆ (2.0)</option>
                            <option value="1">★☆☆☆☆ (1.0)</option>
                            <option value="0">未評価</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">表紙画像 (URL指定 / 画像選択)</label>
                    <div class="space-y-2">
                        <div class="flex gap-2">
                            <input type="text" id="formCoverUrl" placeholder="画像URLを入力 (https://...)" oninput="previewCoverImage(this.value)" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-brand-500">
                            <label class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-xl border border-slate-700 cursor-pointer shrink-0 flex items-center gap-1.5 transition">
                                <i class="fa-solid fa-upload text-brand-400"></i> 画像選択
                                <input type="file" id="formCoverFile" accept="image/*" onchange="handleCoverFileUpload(event)" class="hidden">
                            </label>
                        </div>
                        <div id="coverPreviewContainer" class="hidden relative w-20 h-28 rounded-lg overflow-hidden border border-slate-700 bg-slate-950 shadow-md">
                            <img id="coverPreviewImg" src="" referrerpolicy="no-referrer" class="w-full h-full object-cover">
                            <button type="button" onclick="removeCoverImage()" class="absolute top-1 right-1 bg-rose-600/90 hover:bg-rose-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-[10px] transition shadow">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">メモ・感想</label>
                    <textarea id="formNotes" rows="2" placeholder="感想や気になったセリフなどを入力..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-brand-500"></textarea>
                </div>

                <div class="pt-2 flex items-center justify-end gap-3">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-400 hover:text-white transition">キャンセル</button>
                    <button type="submit" class="px-5 py-2 rounded-xl text-xs font-semibold bg-brand-600 hover:bg-brand-500 text-white shadow-lg shadow-brand-600/30 transition">保存する</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: View Details -->
    <div id="detailModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm hidden opacity-0 transition-opacity duration-200">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl transform scale-95 transition-transform duration-200" id="detailModalContent">
            <div id="detailContainer"></div>
        </div>
    </div>

    <!-- Modal: AI Manga Recommendations -->
    <div id="aiRecommendModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm hidden opacity-0 transition-opacity duration-200">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-2xl overflow-hidden shadow-2xl transform scale-95 transition-transform duration-200" id="aiRecommendModalContent">
            <div class="px-6 py-4 border-b border-slate-800 flex items-center justify-between bg-gradient-to-r from-purple-900/40 via-slate-900 to-indigo-900/40">
                <h3 class="text-base font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles text-amber-400"></i> AIおすすめ漫画診断
                </h3>
                <button onclick="closeAiRecommendModal()" class="text-slate-400 hover:text-white p-1 rounded-lg transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="p-6 space-y-5 max-h-[80vh] overflow-y-auto">
                <p class="text-xs text-slate-300 leading-relaxed">
                    あなたの記録した読書傾向（評価・高評価作品など）をAIが分析し、次におすすめの漫画を提案します。
                </p>

                <div class="bg-slate-950 p-3.5 rounded-xl border border-slate-800 space-y-2">
                    <div class="flex items-center justify-between">
                        <label class="text-xs font-semibold text-slate-300">Gemini API キー <span class="text-slate-500 font-normal">(完全無料)</span></label>
                        <a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-[10px] text-brand-400 hover:underline">キーを取得 <i class="fa-solid fa-arrow-up-right-from-square"></i></a>
                    </div>
                    <div class="flex gap-2">
                        <input type="password" id="geminiApiKeyInput" placeholder="AIzaSy..." class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-100 placeholder-slate-600 focus:outline-none focus:border-brand-500">
                        <button onclick="saveGeminiApiKey()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-lg border border-slate-700 transition shrink-0">保存</button>
                    </div>
                    <p class="text-[10px] text-slate-500">※キーは安全にブラウザ内(ローカル)にのみ保存されます。AI診断を行うにはキーの設定が必須です。</p>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                    <button onclick="setAiPref('favorites')" id="pref-favorites" class="ai-pref-btn px-3 py-2 rounded-xl text-xs font-semibold bg-indigo-600 text-white border border-indigo-500 transition text-center">
                        ⭐ 高評価作品ベース
                    </button>
                    <button onclick="setAiPref('similar')" id="pref-similar" class="ai-pref-btn px-3 py-2 rounded-xl text-xs font-semibold bg-slate-950 text-slate-400 border border-slate-800 hover:text-slate-200 transition text-center">
                        📖 読了作品の傾向から
                    </button>
                    <button onclick="setAiPref('trending')" id="pref-trending" class="ai-pref-btn px-3 py-2 rounded-xl text-xs font-semibold bg-slate-950 text-slate-400 border border-slate-800 hover:text-slate-200 transition text-center">
                        🔥 隠れた名作・話題作
                    </button>
                </div>

                <button onclick="generateAiRecommendations()" id="generateAiRecBtn" class="w-full py-3 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white text-xs sm:text-sm font-bold transition shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-sparkles text-amber-300"></i> AIに診断してもらう
                </button>

                <div id="aiRecResults" class="space-y-3 pt-2">
                    <div class="text-center py-8 text-slate-500 text-xs">
                        <i class="fa-solid fa-robot text-2xl mb-2 text-slate-600 block"></i>
                        「AIに診断してもらう」ボタンを押すと、おすすめ作品が表示されます。
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Application Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        // Firebase 設定
        const HARDCODED_FIREBASE_CONFIG = {
            apiKey: "AIzaSyCnGR9UsV_xyuLJ62W5Shjatvbm_Pqubr8",
            authDomain: "manga-dkrk.firebaseapp.com",
            projectId: "manga-dkrk",
            storageBucket: "manga-dkrk.firebasestorage.app",
            messagingSenderId: "237727833601",
            appId: "1:237727833601:web:6d9efc497233b67ec36a00",
            measurementId: "G-N170G255GN"
        };

        let db = null;
        let auth = null;
        let activeUnsubscribe = null;

        // Gemini API Configuration
        const GEMINI_MODEL = "gemini-1.5-flash";
        let savedGeminiApiKey = localStorage.getItem('mangalog_gemini_api_key') || '';

        function saveGeminiApiKey() {
            const val = document.getElementById('geminiApiKeyInput').value.trim();
            if (val) {
                savedGeminiApiKey = val;
                localStorage.setItem('mangalog_gemini_api_key', val);
                showToast("APIキーを保存しました");
            } else {
                showToast("APIキーを入力してください");
            }
        }

        async function callGeminiApi(prompt, systemInstruction = "", responseSchema = null) {
            if (!savedGeminiApiKey) {
                throw new Error("API_KEY_MISSING");
            }
            
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${savedGeminiApiKey}`;

            const payload = {
                contents: [{ parts: [{ text: prompt }] }]
            };

            if (systemInstruction) payload.systemInstruction = { parts: [{ text: systemInstruction }] };
            // エラーの原因になりやすい検索ツール(Tools)を一時的に除外して安定化
            if (responseSchema) payload.generationConfig = { responseMimeType: "application/json", responseSchema: responseSchema };

            let delay = 1000;
            for (let attempt = 0; attempt < 3; attempt++) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    const resJson = await response.json();
                    
                    // HTTPエラーの場合は、APIからの詳細なエラーメッセージを取得して投げる
                    if (!response.ok) {
                        const errMsg = resJson.error?.message || `HTTP Error: ${response.status}`;
                        throw new Error(errMsg);
                    }
                    
                    return resJson;
                } catch (err) {
                    if (attempt === 2 || err.message !== "Failed to fetch") throw err; // ネットワークエラー以外は再試行せずにすぐエラーを投げる
                    await new Promise(res => setTimeout(res, delay));
                    delay *= 2;
                }
            }
        }

        window.mangas = [];
        window.currentFilterStatus = 'all';
        window.selectedAiPref = 'favorites';
        window.currentViewMode = localStorage.getItem('mangalog_view_mode') || 'grid';

        function toggleViewMode() {
            window.currentViewMode = window.currentViewMode === 'grid' ? 'list' : 'grid';
            localStorage.setItem('mangalog_view_mode', window.currentViewMode);
            renderApp();
        }

        function loadLocalData() {
            try {
                const stored = localStorage.getItem('mangalog_data');
                window.mangas = stored ? JSON.parse(stored) : [];
            } catch (e) {
                console.warn("Local storage error:", e);
                window.mangas = [];
            }

        let badgeTimeout = null;
        function updateSyncBadge(status) {
            const badge = document.getElementById('syncStatusBadge');
            if (!badge) return;
            if (badgeTimeout) clearTimeout(badgeTimeout);

            if (status === 'syncing') {
                badge.classList.remove('hidden');
                badge.className = "text-[11px] font-semibold px-2 py-1 sm:px-2.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30 transition duration-300 whitespace-nowrap flex items-center gap-1 shrink-0";
                badge.innerHTML = `<i class="fa-solid fa-rotate animate-spin"></i><span class="hidden sm:inline">同期中...</span>`;
            } else if (status === 'synced') {
                badge.classList.remove('hidden');
                badge.className = "text-[11px] font-semibold px-2 py-1 sm:px-2.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 transition duration-300 whitespace-nowrap flex items-center gap-1 shrink-0";
                badge.innerHTML = `☁️<span class="hidden sm:inline">クラウド同期済み</span>`;
                badgeTimeout = setTimeout(() => { badge.classList.add('hidden'); }, 3000);
            } else if (status === 'error') {
                badge.classList.remove('hidden');
                badge.className = "text-[11px] font-semibold px-2 py-1 sm:px-2.5 rounded-full bg-rose-500/20 text-rose-300 border border-rose-500/30 transition duration-300 whitespace-nowrap flex items-center gap-1 shrink-0";
                badge.innerHTML = `⚠️<span class="hidden sm:inline">同期エラー</span>`;
            } else if (status === 'saved') {
                badge.classList.remove('hidden');
                badge.className = "text-[11px] font-semibold px-2 py-1 sm:px-2.5 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 transition duration-300 whitespace-nowrap flex items-center gap-1 shrink-0";
                badge.innerHTML = `💾<span class="hidden sm:inline">ローカル保存</span>`;
                badgeTimeout = setTimeout(() => { badge.classList.add('hidden'); }, 2500);
            } else {
                badge.classList.add('hidden');
            }
        }

        async function initFirebaseSync() {
            try {
                if (HARDCODED_FIREBASE_CONFIG && HARDCODED_FIREBASE_CONFIG.apiKey) {
                    const app = initializeApp(HARDCODED_FIREBASE_CONFIG);
                    auth = getAuth(app);
                    db = getDatabase(app);

                    onAuthStateChanged(auth, (user) => {
                        updateAuthUI(user);
                        if (user && !user.isAnonymous) {
                            setupRealtimeSync(user);
                        } else {
                            if (activeUnsubscribe) {
                                activeUnsubscribe();
                                activeUnsubscribe = null;
                            }
                            loadLocalData();
                            renderApp();
                        }
                    });
                }
            } catch (err) {
                console.warn("Firebase Auth Init Error:", err);
            }
        }

        function updateAuthUI(user) {
            const loginBtn = document.getElementById('googleLoginBtn');
            const logoutBtn = document.getElementById('googleLogoutBtn');

            if (user && !user.isAnonymous) {
                if (loginBtn) loginBtn.classList.add('hidden');
                if (logoutBtn) logoutBtn.classList.remove('hidden');
            } else {
                if (loginBtn) loginBtn.classList.remove('hidden');
                if (logoutBtn) logoutBtn.classList.add('hidden');
            }
        }

        async function handleGoogleLogin() {
            if (!auth) return;
            try {
                const provider = new GoogleAuthProvider();
                await signInWithPopup(auth, provider);
                showToast("Googleアカウントでログインしました");
            } catch (err) {
                console.error("Google Auth error:", err);
                showToast("ログインに失敗しました: " + (err.message || ''));
            }
        }

        async function handleGoogleLogout() {
            if (!auth) return;
            try {
                if (activeUnsubscribe) {
                    activeUnsubscribe();
                    activeUnsubscribe = null;
                }
                await signOut(auth);
                loadLocalData();
                renderApp();
                showToast("ログアウトしました");
            } catch (err) {
                console.error("Logout error:", err);
            }
        }

        function setupRealtimeSync(user) {
            if (!db || !user || user.isAnonymous) return;
            if (activeUnsubscribe) activeUnsubscribe();

            updateSyncBadge('syncing');

            const userRef = ref(db, 'users/' + user.uid);

            activeUnsubscribe = onValue(userRef, (snapshot) => {
                const val = snapshot.val();
                if (val && Array.isArray(val.mangas)) {
                    window.mangas = val.mangas;
                } else if (val && val.mangas) {
                    window.mangas = Object.values(val.mangas);
                } else {
                    window.mangas = [];
                }
                saveLocalData();
                renderApp();
                updateSyncBadge('synced');
            }, (error) => {
                console.error("Realtime DB sync error:", error);
                updateSyncBadge('error');
                showToast("⚠️ クラウド同期エラーが発生しました");
            });
        }

        async function saveData() {
            saveLocalData();

            const user = auth?.currentUser;
            if (!user || user.isAnonymous) {
                updateSyncBadge('saved');
                return;
            }

            try {
                updateSyncBadge('syncing');
                const userRef = ref(db, 'users/' + user.uid);
                await set(userRef, {
                    mangas: window.mangas,
                    updatedAt: new Date().toISOString()
                });
                updateSyncBadge('synced');
            } catch (e) {
                console.error("Cloud save failed:", e);
                updateSyncBadge('error');
                showToast("⚠️ クラウド保存に失敗しました");
            }
        }

        function renderApp() {
            const mangaGrid = document.getElementById('mangaGrid');
            const emptyState = document.getElementById('emptyState');
            const searchVal = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
            const sortVal = document.getElementById('sortSelect')?.value || 'updated-desc';

            let filtered = window.mangas.filter(item => {
                const matchStatus = window.currentFilterStatus === 'all' || item.status === window.currentFilterStatus;
                const matchSearch = item.title.toLowerCase().includes(searchVal) || (item.author && item.author.toLowerCase().includes(searchVal));
                return matchStatus && matchSearch;
            });

            filtered.sort((a, b) => {
                if (sortVal === 'updated-desc') return new Date(b.updatedAt) - new Date(a.updatedAt);
                if (sortVal === 'rating-desc') return b.rating - a.rating;
                if (sortVal === 'chapter-desc') return (b.readChap || 0) - (a.readChap || 0);
                if (sortVal === 'title-asc') return a.title.localeCompare(b.title, 'ja');
                return 0;
            });

            if (!mangaGrid) return;
            mangaGrid.innerHTML = '';
            
            const viewModeIcon = document.getElementById('viewModeIcon');
            if (viewModeIcon) {
                viewModeIcon.className = window.currentViewMode === 'grid' ? "fa-solid fa-list text-sm" : "fa-solid fa-border-all text-sm";
            }

            if (filtered.length === 0) {
                emptyState?.classList.remove('hidden');
            } else {
                emptyState?.classList.add('hidden');
                if (window.currentViewMode === 'grid') {
                    mangaGrid.className = "grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 sm:gap-5";
                    filtered.forEach(manga => mangaGrid.appendChild(createMangaCard(manga)));

            }
        }

        function handleCoverFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 300;
                    const scaleSize = MAX_WIDTH / img.width;
                    const width = img.width > MAX_WIDTH ? MAX_WIDTH : img.width;
                    const height = img.width > MAX_WIDTH ? img.height * scaleSize : img.height;

                    canvas.width = width;
                    canvas.height = height;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                    document.getElementById('formCoverUrl').value = compressedDataUrl;
                    previewCoverImage(compressedDataUrl);
                    showToast("写真を最適化して設定しました");
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

                            <div class="flex items-center gap-1 mt-0.5">
                                ${starsHtml}
                                <span class="text-xs text-slate-300 ml-1 font-bold">${manga.rating > 0 ? manga.rating + '.0' : '未評価'}</span>
                            </div>
                        </div>
                    </div>

                    <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 flex items-center justify-between">
                        <span class="text-xs text-slate-400">最終更新日</span>
                        <span class="text-xs text-slate-200 font-semibold">${new Date(manga.updatedAt).toLocaleDateString('ja-JP')}</span>
                    </div>

                    <div>
                        <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5">メモ・感想</h4>
                        <div class="bg-slate-950 p-3.5 rounded-xl border border-slate-800 text-xs text-slate-200 whitespace-pre-wrap leading-relaxed min-h-[60px]">
                            ${manga.notes ? manga.notes : '<span class="text-slate-600 italic">メモはありません。</span>'}
                        </div>
                    </div>

                    <div class="pt-3 border-t border-slate-800 flex items-center justify-between">
                        <button onclick="deleteManga('${manga.id}')" class="px-3 py-2 rounded-xl text-xs font-bold bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 transition flex items-center gap-1.5">
                            <i class="fa-solid fa-trash-can"></i> 削除
                        </button>
                        <div class="flex items-center gap-1.5">
                            <button onclick="openEditModal('${manga.id}')" class="px-3 py-2 rounded-xl text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition flex items-center gap-1.5 hidden sm:flex">
                                <i class="fa-solid fa-pen"></i> 編集
                            </button>
                            <div class="flex items-center gap-1">
                                <button onclick="quickDecrementChap('${manga.id}'); openDetailModal('${manga.id}');" class="px-3 py-2 rounded-xl text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition flex items-center">
                                    <i class="fa-solid fa-minus"></i>
                                </button>
                                <button onclick="quickIncrementChap('${manga.id}'); openDetailModal('${manga.id}');" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-brand-600 hover:bg-brand-500 text-white transition flex items-center gap-1.5">
                                    <i class="fa-solid fa-plus"></i> 1話進める
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            const modal = document.getElementById('detailModal');
            const content = document.getElementById('detailModalContent');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
                content.classList.add('scale-100');
            }, 10);
        }

        function closeDetailModal() {
            const modal = document.getElementById('detailModal');
            const content = document.getElementById('detailModalContent');
            modal.classList.add('opacity-0');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 200);
        }

        function deleteManga(id) {
            const item = window.mangas.find(m => m.id === id);
            if (!item) return;
            window.mangas = window.mangas.filter(m => m.id !== id);
            saveData();
            closeDetailModal();
            renderApp();
            showToast(`「${item.title}」 を削除しました`);
        }

        function setFilterStatus(status) {
            window.currentFilterStatus = status;
            document.querySelectorAll('.status-tab').forEach(tab => {
                tab.classList.remove('bg-brand-600', 'text-white', 'active');
                tab.classList.add('text-slate-400', 'hover:text-slate-200');
            });
            const activeTab = document.getElementById(`tab-${status}`);
            if (activeTab) {
                activeTab.classList.add('bg-brand-600', 'text-white', 'active');
                activeTab.classList.remove('text-slate-400', 'hover:text-slate-200');
            }
            renderApp();
        }

        function openAiRecommendModal() {
            document.getElementById('geminiApiKeyInput').value = savedGeminiApiKey;
            const modal = document.getElementById('aiRecommendModal');
            const content = document.getElementById('aiRecommendModalContent');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
                content.classList.add('scale-100');
            }, 10);
        }

        function closeAiRecommendModal() {
            const modal = document.getElementById('aiRecommendModal');
            const content = document.getElementById('aiRecommendModalContent');
            modal.classList.add('opacity-0');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 200);
        }

        function setAiPref(pref) {
            window.selectedAiPref = pref;
            document.querySelectorAll('.ai-pref-btn').forEach(btn => {
                btn.className = "ai-pref-btn px-3 py-2 rounded-xl text-xs font-semibold bg-slate-950 text-slate-400 border border-slate-800 hover:text-slate-200 transition text-center";
            });
            const active = document.getElementById(`pref-${pref}`);
            if (active) {
                active.className = "ai-pref-btn px-3 py-2 rounded-xl text-xs font-semibold bg-indigo-600 text-white border border-indigo-500 transition text-center";
            }
        }

        async function generateAiRecommendations() {
            const btn = document.getElementById('generateAiRecBtn');
            const resultsContainer = document.getElementById('aiRecResults');

            if (window.mangas.length === 0) {
                showToast("まずは何作品か漫画を登録してください");
                return;
            }

            const originalBtnHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin text-amber-300"></i> AI分析中...`;

            resultsContainer.innerHTML = `
                <div class="text-center py-8 text-slate-400 text-xs space-y-2">
                    <i class="fa-solid fa-wand-magic-sparkles text-2xl text-amber-400 animate-bounce block"></i>
                    <p class="font-semibold text-slate-200">あなたの読書記録をAIが分析しています...</p>
                    <p class="text-[11px] text-slate-500">おすすめの作品を厳選中</p>
                </div>
            `;

            try {
                const userLogSummary = window.mangas.map(m => `・タイトル: ${m.title}, 作者: ${m.author || '不明'}, 評価: ${m.rating}/5, ステータス: ${m.status}`).join('\n');
                const prefPrompts = {
                    favorites: "ユーザーが高評価（星4以上）をつけている作品の傾向に最も近いおすすめ漫画を3つ提案してください。",
                    similar: "ユーザーが読了・読書中の漫画ジャンルやテイストから、次に読むのにぴったりな作品を3つ提案してください。",
                    trending: "ユーザーの読書傾向を踏まえつつ、まだ読んでなさそうな隠れた名作や話題作を3つ提案してください。"
                };

                const prompt = `【ユーザーの読書記録】\n${userLogSummary}\n\n【条件】\n${prefPrompts[window.selectedAiPref] || prefPrompts.favorites}\nユーザーがまだ登録していない新しい漫画を3つ推薦してください。`;
                const schema = {
                    type: "ARRAY",
                    items: {
                        type: "OBJECT",
                        properties: {
                            title: { type: "STRING" },
                            author: { type: "STRING" },
                            reason: { type: "STRING" },
                            description: { type: "STRING" }
                        },
                        required: ["title", "author", "reason", "description"]
                    }
                };

                // 第4引数 (useSearch) を削除し、安定版の呼び出しに変更
                const resData = await callGeminiApi(prompt, "あなたは漫画ソムリエです。ユーザーの嗜好に合ったおすすめ漫画を説得力のある理由とともに推薦してください。", schema);

                let textRes = resData?.candidates?.[0]?.content?.parts?.[0]?.text;

                if (textRes) {
                    // AIが余計なMarkdown記法 (```json など) を付けてきた場合に備えて除去する
                    textRes = textRes.replace(/```json/gi, '').replace(/```/g, '').trim();
                    const recommendations = JSON.parse(textRes);
                    
                    resultsContainer.innerHTML = '';
                    recommendations.forEach((rec) => {
                        const recCard = document.createElement('div');
                        recCard.className = "bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2 relative group hover:border-indigo-500/50 transition";
                        const safeTitle = (rec.title || '').replace(/'/g, "\\'");
                        const safeAuthor = (rec.author || '').replace(/'/g, "\\'");
                        recCard.innerHTML = `
                            <div class="flex items-start justify-between gap-3">
                                <div>
                                    <h4 class="font-bold text-sm text-white">${rec.title}</h4>
                                    <p class="text-xs text-slate-400 font-medium">${rec.author || '作者情報なし'}</p>
                                </div>
                                <button onclick="addRecommendedManga('${safeTitle}', '${safeAuthor}')" class="px-3 py-1.5 rounded-lg bg-brand-600 hover:bg-brand-500 text-white text-xs font-bold transition shrink-0 flex items-center gap-1 shadow-md shadow-brand-600/20">
                                    <i class="fa-solid fa-plus text-[10px]"></i> 読みたいに追加
                                </button>
                            </div>
                            <div class="text-[11px] text-amber-300/90 font-medium bg-amber-400/10 px-2.5 py-1 rounded-lg border border-amber-400/20 inline-block">
                                <i class="fa-solid fa-sparkles mr-1"></i> ${rec.reason}
                            </div>
                            <p class="text-xs text-slate-300 leading-relaxed">${rec.description}</p>
                        `;
                        resultsContainer.appendChild(recCard);
                    });
                } else {
                    console.error("AI Response error:", resData);
                    resultsContainer.innerHTML = `<div class="text-center py-6 text-slate-400 text-xs">診断結果を取得できませんでした。再度お試しください。</div>`;
                }
            } catch (err) {
                console.error("AI Rec error:", err);
                if (err.message === "API_KEY_MISSING") {
                    resultsContainer.innerHTML = `<div class="text-center py-6 text-amber-400 text-xs font-semibold">⚠️ Gemini APIキーが設定されていません。<br>上の設定欄にキーを入力して「保存」を押してからお試しください。</div>`;
                } else {
                    // エラーの内容を画面に直接表示するようにしました
                    resultsContainer.innerHTML = `<div class="text-center py-6 text-rose-400 text-xs">AI診断中にエラーが発生しました。<br><br>【エラー原因】<br><span class="text-[10px] text-rose-300 font-mono">${err.message}</span><br><br>※ APIキーが間違っているか、キーが無効になっている可能性があります。</div>`;
                }
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalBtnHtml;
            }
        }

        function addRecommendedManga(title, author) {
            const newManga = {
                id: Date.now().toString(),
                title: title,
                author: author,
                readChap: 0,
                status: 'plan',
                rating: 0,
                notes: 'AIおすすめ診断より追加',
                coverUrl: '',
                coverColor: 'from-indigo-600 via-indigo-700 to-purple-900',
                updatedAt: new Date().toISOString()
            };

            window.mangas.unshift(newManga);
            saveData();
            renderApp();
            showToast(`「${title}」を「読みたい」に追加しました！`);
        }

        function showToast(msg) {
            const container = document.getElementById('toastContainer');
            if (!container) return;

            const toast = document.createElement('div');
            toast.className = "px-4 py-2.5 bg-slate-800 border border-slate-700 text-slate-100 text-xs sm:text-sm font-semibold rounded-xl shadow-xl transition-all duration-300 transform translate-y-2 opacity-0 flex items-center gap-2 pointer-events-auto";
            toast.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i> <span>${msg}</span>`;

            container.appendChild(toast);

            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', '-translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // 全ての関数をグローバル（window）に登録
        window.handleGoogleLogin = handleGoogleLogin;
        window.handleGoogleLogout = handleGoogleLogout;
        window.openAddModal = openAddModal;
        window.openEditModal = openEditModal;
        window.closeModal = closeModal;
        window.handleFormSubmit = handleFormSubmit;
        window.openDetailModal = openDetailModal;
        window.closeDetailModal = closeDetailModal;
        window.deleteManga = deleteManga;
        window.toggleViewMode = toggleViewMode;
        window.quickIncrementChap = quickIncrementChap;
        window.quickDecrementChap = quickDecrementChap;
        window.handleCoverFileUpload = handleCoverFileUpload;
        window.previewCoverImage = previewCoverImage;
        window.removeCoverImage = removeCoverImage;
        window.setFilterStatus = setFilterStatus;
        window.openAiRecommendModal = openAiRecommendModal;
        window.closeAiRecommendModal = closeAiRecommendModal;
        window.setAiPref = setAiPref;
        window.saveGeminiApiKey = saveGeminiApiKey;
        window.generateAiRecommendations = generateAiRecommendations;
        window.addRecommendedManga = addRecommendedManga;
        window.renderApp = renderApp;
        window.saveData = saveData;

        window.addEventListener('DOMContentLoaded', () => {
            loadLocalData();
            initFirebaseSync();
            renderApp();
        });
    </script>
</body>
</html>
